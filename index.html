</style></head><body><div class="shell"><header class="topbar"><div class="brand">✦ Wilmas Weihnachtsabenteuer</div><button class="smallbutton" id="restart" type="button">↺ Neustart</button></header><div class="progress"><div id="progressBar"></div></div><main class="book" id="app" aria-live="polite"></main><div class="footer">Ein kleines Weihnachtsabenteuer für Jara · 21. Dezember ✨</div></div><script>
'use strict';
const KEY='wilma-escape-v2';
const steps=[
{type:'start',title:'Wilma und der vergessene Wunschzettel',chapter:'Ein Weihnachtsabenteuer',image:'hero',text:'Ein unerwarteter Besuch, ein ziemlich vergesslicher Weihnachtswichtel und ein Wunschzettel, der dringend zum Nordpol muss.\n\nBist du bereit für eine Reise durch die Weihnachtsnacht?'},
{title:'Ein Rums in der Nacht',chapter:'Kapitel 1 · Ein unerwarteter Besuch',image:'absturz',text:'Es ist der 21. Dezember. Nur noch drei Tage bis Heiligabend.\n\nJara hat mit dem Adventskalender für ihre Freunde alle Hände voll zu tun: 23 Türchen, 23 Überraschungen und ungefähr eine Million Dinge, an die sie denken muss.\n\nGerade sitzt sie gemütlich am Fenster und bastelt, als plötzlich ein gewaltiges Geräusch die Stille zerreißt.\n\nRUMMS!',dialogs:[['Wilma','Aua! Also ... das war jetzt nicht ganz die Landung, die ich geplant hatte!']]},
{title:'Die Wichtelin vor der Tür',chapter:'Kapitel 1',image:'begegnung',text:'Vor Jaras Tür steht eine winzige Gestalt mit roter Zipfelmütze, schiefem Schal und einer beachtlichen Beule auf der Stirn.',dialogs:[['Jara','Ähm ... hallo?'],['Wilma','Hallo! Du bist doch Jara, oder? Bitte sag, dass du Jara bist. Ich bin nämlich nicht sicher, ob ich noch eine Landung überstehe.'],['Jara','Ja, ich bin Jara. Und du bist ...?'],['Wilma','Wilma! Weihnachtswichtelin, Abteilung Wunschzettel und Sonderzustellungen. DEIN WUNSCHZETTEL FEHLT!'],['Jara','Mein was?'],['Wilma','Du hast keinen Wunschzettel geschickt! Und Weihnachten ist in drei Tagen! Also bin ich mit einem Schlitten gekommen. Obwohl ich eigentlich gar keinen Schlittenführerschein habe.'],['Jara','Das erklärt einiges.']]},
{type:'room',title:'Wo ist der Wunschzettel?',chapter:'Rätsel 1 · Das chaotische Zimmer',text:'Jara führt Wilma in ihr Zimmer. Nach dem Basteln für den Adventskalender ist hier noch einiges durcheinander. Wo hat Jara ihren Wunschzettel bloß hingelegt?',dialogs:[['Wilma','Ich bin hervorragend im Suchen! Letzte Woche habe ich meine Mütze nur fünf Stunden gesucht. Sie war auf meinem Kopf.']]},
{title:'Auf zum Schlitten!',chapter:'Kapitel 1',image:'aufbruch',text:'Wilma hält den gefundenen Umschlag triumphierend in die Höhe. Draußen scharren vier Rentiere ungeduldig mit den Hufen.',dialogs:[['Wilma','Geschafft! Jetzt müssen wir den Wunschzettel nur noch zum Nordpol bringen!'],['Jara','Und du kannst den Schlitten fliegen?'],['Wilma','Na ja. Das mit der Landung üben wir noch. Und seit ich vorhin auf den Kopf gefallen bin, ist mein Gedächtnis ein bisschen durcheinander. Kommst du mit?'],['Jara','Na gut. Aber ich möchte heil wieder nach Hause kommen.']]},
{type:'map',title:'Eine kleine Orientierungspanne',chapter:'Rätsel 2 · Die Flugroute',text:'Wilma klettert auf den Kutschbock. Die Rentiere warten. Doch dann erstarrt sie.',dialogs:[['Jara','In welche Richtung müssen wir eigentlich?'],['Wilma','Oh. Das ... ist eine ausgezeichnete Frage. Wir müssen zuerst zur Süßigkeitenhütte, damit die Rentiere eine Pause machen können.'],['Wilma','Moment mal! Ich glaube, ich erinnere mich wieder! Als ich zu dir geflogen bin, bin ich zuerst über die alte Mühle gekommen. Danach ging es am Spielplatz vorbei, dann über den großen See. Anschließend habe ich noch eine Kurve um den alten Wasserturm gemacht, bevor ich schließlich bei deinem Haus mit Rheinblick gelandet bin!'],[null,'Wilma zieht eine zerknitterte Karte aus ihrer Manteltasche und breitet sie vor Jara aus.'],['Wilma','Ich hatte mir extra einen Trick überlegt, damit ich mir anhand meiner Flugroute merken kann, in welche Richtung ich zurückfliegen muss. Ziemlich genial von mir, oder?'],[null,'Sie betrachtet die Karte. Ihr zufriedenes Grinsen verschwindet.'],['Wilma','Tja. Leider habe ich vergessen, wie der Trick funktioniert. Aber vielleicht erkennst du ja etwas, wenn du dir meine Flugroute anschaust?']]},
{title:'Über den Dächern',chapter:'Kapitel 2 · Der Flug',image:'schlittenflug',text:'Mit einem kräftigen Ruck hebt der Schlitten ab. Unter Wilma und Jara werden die verschneiten Dächer von Köln immer kleiner. Auf dem Rhein spiegeln sich die Lichter der Stadt.',dialogs:[['Wilma','WESTEN! Natürlich! Das wusste ich doch!'],['Jara','Gerade eben wusstest du es noch nicht.'],['Wilma','Ja, aber jetzt weiß ich es wieder. Das zählt!']]},
{title:'Die schönsten Weihnachtskugeln',chapter:'Kapitel 3 · Wilmas Erinnerungen',image:'weihnachtsfoto',text:'Wilma holt ihr kleines Fotoalbum aus der Tasche. Sie zieht ein Foto heraus und hält es Jara im Schlitten hin.',dialogs:[['Wilma','Für den Baum habe ich extra nur rote Weihnachtskugeln aufgehängt. Und ich hatte mein allerliebstes grünes Kleid und meine schöne rote Weihnachtsmütze an! Siehst du die kleinen gelben Sterne? An dem Tag habe ich auch ganz viele Geschenke eingepackt, in Orange, Lila und Blau. Alle sieben habe ich unter den Baum gelegt!'],['Jara','Du hast wirklich ein interessantes Farbkonzept.'],['Wilma','Danke! Ich habe ein ausgezeichnetes Auge für Farben!']]},
{title:'Kekse zu Nikolaus',chapter:'Kapitel 3 · Wilmas Erinnerungen',image:'keksfoto',text:'Wilma schiebt das erste Foto zurück ins Album und hält Jara den nächsten Abzug hin.',dialogs:[['Wilma','Da habe ich meine fünf Wichtelfreunde in der Werkstatt getroffen. Das sind Gerda und Fridolin. Zusammen sind wir wirklich ein tolles Trio! Wir haben Kekse gebacken und danach richtig viele verdrückt. Jeder von uns hat mindestens zwei Kekse gegessen! Das ist noch gar nicht lange her. Das war am 6. Dezember, zu Nikolaus.'],['Jara','Bist du sicher, dass ihr nur zwei Kekse gegessen habt? Auf euren Tellern liegen doch viel mehr. Waren es vielleicht fünf?'],['Wilma','Nur fünf Kekse? Das wäre doch viel zu wenig! Wir haben mindestens zwei pro Person gegessen.']]},
{title:'Die Süßigkeitenhütte',chapter:'Kapitel 4 · Vier hungrige Rentiere',image:'suessigkeitenhuette',text:'Der Schlitten setzt vor einem kleinen Häuschen zwischen den verschneiten Tannen auf. Unter der Schneeschicht glänzt Zuckerguss, und rund um die Tür kleben Zuckerstangen und bunte Bonbons. In der Luft liegt der Duft von Zimt und Lebkuchen.',dialogs:[['Jara','Da sind wir! Das sieht ja aus wie ein echtes Lebkuchenhaus.'],['Wilma','Ich lauf schnell rein und hole für alle vier Rentiere ihre Lieblingssüßigkeiten. Rudolf, Robert, Regina, Rita, gleich gibt’s was Leckeres!']]},
{title:'Oh nein, das Portemonnaie!',chapter:'Kapitel 4 · An der Kasse',image:'an-der-kasse',text:'Wilma eilt in die Hütte. Jara folgt ihr bis zur Kasse. Dort tastet Wilma erst ihre Manteltaschen ab, dann die Hosentaschen und schließlich sogar ihre Mütze.',dialogs:[['Wilma','MEIN PORTEMONNAIE IST WEG! Nein, Moment. Ich habe es bestimmt nur besonders sicher versteckt.'],['Jara','Weißt du denn noch, wo?'],['Wilma','Na klar! Ich habe mir eine geheime Notiz gemacht. Die wichtigen Wörter sind in meiner Lieblingsfarbe. Rot! So kann niemand sonst mein Versteck finden.']]},
{type:'colors',title:'Wilmas wichtige Notiz',chapter:'Rätsel 3 · Die bunte Notiz'},
{type:'matching',title:'Vier Rentiere, vier Leckereien',chapter:'Rätsel 4 · Die Süßigkeiten',image:'vier-leckereien',text:'Wilma findet ihr Portemonnaie auf der Rückbank. Kurz darauf treten sie und Jara mit den Armen voller Süßigkeiten wieder hinaus in den Schnee. Die Rentiere recken neugierig die Nasen.',dialogs:[['Wilma','Moment! Jedes Rentier muss seine Lieblingssüßigkeit bekommen. Wenn Robert Rudolfs Leckerei zuerst erwischt, frisst er sie ihm einfach weg!'],['Jara','Weißt du noch, wer was am liebsten mag?'],['Wilma','Na klar! Das hab ich mir auf einem Zettel notiert.']]},
{title:'Alle satt!',chapter:'Kapitel 4 · Weiter zum Nordpol',image:'alle-satt',text:'Wilma verteilt die Süßigkeiten. Die vier Rentiere knabbern zufrieden. Als auch der letzte Krümel weg ist, klettern Wilma und Jara wieder in den Schlitten.',dialogs:[['Wilma','Jetzt aber wirklich zum Nordpol! Ohne weitere Zwischenfälle!']]},
{title:'Endlich am Nordpol',chapter:'Kapitel 5 · Das letzte Geheimnis',image:'nordpol',text:'Der Schlitten fliegt über endlose verschneite Wälder. Am Himmel tanzen grüne und violette Nordlichter. Schließlich taucht die große, hell erleuchtete Weihnachtswerkstatt auf.\n\nFür die Landung reicht Jara Wilma die Zügel. Diesmal landet Wilma ganz sanft im Schnee.',dialogs:[['Wilma','HA! Perfekte Landung! Vielleicht werde ich noch eine richtige Schlittenpilotin!'],['Jara','Vielleicht solltest du trotzdem erst den Führerschein machen.'],['Wilma','Ach, diese Formalitäten immer!']]},
{type:'lock',title:'Das letzte Schloss',chapter:'Rätsel 5 · Die Weihnachtswerkstatt',text:'Jara und Wilma treten in die Eingangshalle der Weihnachtswerkstatt. Eine große Holztür versperrt den Weg in die Werkstatt. An der Tür hängt ein Schloss mit vier Zahlenfenstern.',dialogs:[['Wilma','Ach du meine Güte! Das Schloss hatte ich völlig vergessen!'],['Jara','Kennst du den Code?'],['Wilma','Moment, jetzt fällt’s mir wieder ein! Für die erste Ziffer zähle ich die Sterne hier in der Halle. Für die zweite die Glocken, für die dritte die Kerzen, und für die vierte die Geschenke. Den Code hab ich mir selbst ausgedacht. Ich war schon immer besonders gut mit Zahlen!'],['Jara','Dann schauen wir uns die Halle mal genau an.']]},
{title:'Weihnachten ist gerettet!',chapter:'Das große Finale',image:'werkstatt-finale',text:'KLICK! Die schwere Tür springt auf. In der warmen Weihnachtswerkstatt stapeln sich Geschenke. Der Weihnachtsmann blickt von seinem Schreibtisch auf.',dialogs:[['Wilma','WEIHNACHTSMANN! WIR HABEN ES GESCHAFFT!'],['Weihnachtsmann','Wilma? Und wer ist deine Begleitung?'],['Wilma','Das ist Jara! Wir haben ihren Wunschzettel geholt. Und dann bin ich ein ganz kleines bisschen abgestürzt, und dann wussten wir nicht, wo Westen ist, und dann waren die Rentiere hungrig, und dann ...'],['Weihnachtsmann','Wilma! Ganz langsam!'],['Jara','Hier ist mein Wunschzettel. Ich hatte ziemlich viel mit unserem Adventskalender zu tun.'],['Weihnachtsmann','23 Überraschungen für deine Freunde zu organisieren, ist eine Menge Arbeit. Keine Sorge, dein Wunschzettel kommt noch rechtzeitig in die Weihnachtsproduktion!'],['Wilma','JAAAA! Und jetzt gibt es fünf Kekse für jeden! Oder zwei. Ach, heute gibt es einfach so viele, wie jeder möchte!']]},
{type:'end',title:'Frohe Weihnachten euch allen!',image:'heimflug',text:'Der Wunschzettel ist rechtzeitig da, die Rentiere sind satt und Wilma bringt Jara sicher wieder nach Hause. Diesmal ganz ohne Bruchlandung.\n\nWilma und die Weihnachtswichtel wünschen euch allen ein paar besinnliche Weihnachtstage und ein wunderschönes Fest mit euren Liebsten.'}
];
const defaultState=()=>({step:0,storyVersion:1,mapVersion:1,room:[],roomLast:null,map:[],mapChoice:'',matches:['','','',''],wallet:'',code:'',hints:{},error:'',unlocked:[]});
let state=defaultState();try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<steps.length){
  // Earlier saves used steps 10–12 for the same scenes in a different order.
  const oldHutStep = saved.storyVersion !== 1 && saved.step >= 10 && saved.step <= 12;
  const hutStep = saved.step === 12 ? 11 : 10;
  state={...defaultState(),...saved,storyVersion:1,mapVersion:1,map:saved.mapVersion===1?saved.map:[]};
  if(oldHutStep){state.step=hutStep;state.error='';}
}}catch(e){}
const $=s=>document.querySelector(s);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svgWrap(inner,view='0 0 700 400'){return `<svg viewBox="${view}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weihnachtliche Illustration"><defs><linearGradient id="night" x2="0" y2="1"><stop stop-color="#263f4b"/><stop offset="1" stop-color="#718a83"/></linearGradient><linearGradient id="snowg" x2="0" y2="1"><stop stop-color="#f9f2df"/><stop offset="1" stop-color="#c7d6d2"/></linearGradient></defs>${inner}</svg>`}

function illustration(name,width=1536,height=1024){
  return `<img src="assets/${name}.webp" width="${width}" height="${height}" alt="${illustrationAlt[name]}">`;
}
function visual(s){
  if(s.type==='colors')return '';
  let picture;
  if(s.type==='room')picture=roomPicture();
  else if(s.type==='map')picture=mapPicture();
  else if(s.type==='lock')picture=`<div class="puzzleImage puzzleIllustration">${illustration('letztes-schloss')}</div>`;
  else if(s.image==='hero')picture=`<div class="visual hero"><img src="assets/jara-wilma.webp" width="1254" height="1254" alt="Jara und Wilma in einer verschneiten Weihnachtsstadt"><div class="snow"></div></div>`;
  else if(s.image)picture=`<div class="visual storybook">${illustration(s.image)}</div>`;
  else picture=`<div class="visual sceneArt">${art(s.art||'street')}<div class="snow"></div></div>`;
  return `<div class="mediaStage${s.image==='hero'?' coverStage':''}" id="scene-illustration" tabindex="-1">${picture}</div>${s.type==='room'?roomFeedback():''}`;
}
function dialogs(ds){return (ds||[]).map(([who,s])=>who===null?`<p class="narration">${escapeHTML(s)}</p>`:`<div class="dialog ${who==='Jara'?'jara':who==='Weihnachtsmann'?'santa':''}"><span class="speaker">${escapeHTML(who)}</span>${escapeHTML(s)}</div>`).join('')}

  ["Oder","yellow"],["ist","blue"],["es","purple"],["mir","yellow"],["beim","blue"],["Aussteigen","purple"],["in","yellow"],["den","blue"],["Schnee","purple"],["gefallen?","yellow"],
  ["Ich","blue"],["sollte","purple"],["mir","yellow"],["wirklich","blue"],["mal","purple"],["aufschreiben,","yellow"],["wo","blue"],["ich","purple"],["solche","yellow"],["Sachen","blue"],["hinlege.","purple"]
];
function puzzleColors(){
  const words = colorWords.map(([word,color])=>`<span class="word ${color}">${escapeHTML(word)}</span>`).join(' ');
  return `<div class="puzzle"><figure class="noteIllustration">
    ${illustration('notizzettel',1024,1536)}
    <figcaption class="paperNote">
      <p class="noteText">${words}</p>
    </figcaption>
  </figure><div class="task"><strong>WAS TUN?</strong>Wo liegt das Portemonnaie wirklich? Wähle den richtigen Ort.</div><div class="choices">${['Handschuhfach','Rückbank','Hosentasche','Schnee'].map(x=>`<button class="choice ${state.wallet===x?'active':''}" data-action="wallet" data-id="${x}">${x==='Rückbank'?'Auf der ':x==='Schnee'?'Im ':x==='Hosentasche'?'In der ':'Im '}${x}</button>`).join('')}</div>${state.error?`<div class="feedback bad">${state.error}</div>`:''}${hintUI('colors')}</div>`}
function puzzleLock(){return `<div class="puzzle"><div class="task"><strong>DAS ZAHLENSCHLOSS</strong>Welchen vierstelligen Code hat Wilma eingestellt? <a class="pictureLink" href="#scene-illustration">Zum Schlossbild</a></div><input class="code" id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Vierstelliger Zahlencode" placeholder="••••" value="${escapeHTML(state.code)}">${state.error?`<div class="feedback bad">${state.error}</div>`:''}${hintUI('lock')}</div>`}
function render(){let s=steps[state.step],puzzle=s.type&&['room','map','matching','colors','lock'].includes(s.type);$('#progressBar').style.width=`${(state.step+1)/steps.length*100}%`;$('.footer').hidden=s.type==='end';$('#app').innerHTML=`${visual(s)}<section class="page">${s.chapter?`<p class="eyebrow">${escapeHTML(s.chapter)}</p>`:''}<h1 class="heading">${escapeHTML(s.title)}</h1>${s.text?`<p class="narration">${escapeHTML(s.text)}</p>`:''}${dialogs(s.dialogs)}${puzzle?({room:puzzleRoom,map:puzzleMap,matching:puzzleMatching,colors:puzzleColors,lock:puzzleLock}[s.type]||(()=>''))():''}${s.type==='end'?`<p class="endbox">Ende</p>`:''}<div class="actions">${state.step>0?`<button class="secondary" data-action="back">← Zurück</button>`:''}${s.type!=='end'?`<button class="primary" data-action="next">${s.type==='start'?'Abenteuer beginnen':puzzle?'Lösung bestätigen':'Weiter'} →</button>`:`<button class="primary" data-action="restart">Noch einmal spielen ↻</button>`}</div>${puzzle?'<p class="tiny">Du kannst jederzeit Tipps aufdecken. Dein Fortschritt wird auf diesem Gerät gespeichert.</p>':''}</section>`}
function checkNext(){let s=steps[state.step];if(!s.type||!['room','map','matching','colors','lock'].includes(s.type)){next();return}if(s.type==='map'&&state.mapChoice!=='Westen')state.error='Die Rentiere schütteln die Köpfe. Überlege noch einmal, wie Wilmas Flugroute verläuft.';else if(s.type==='matching'&&!solved('matching'))state.error='Wilma liest ihre Notizen noch einmal. „Irgendetwas stimmt da noch nicht!“';else if(s.type==='colors'&&!solved('colors'))state.error='Wilma sucht an diesem Ort, findet aber nichts. Vielleicht helfen die Farben ihrer Notiz?';else if(s.type==='lock'&&!solved('lock'))state.error='Das Schloss rührt sich nicht. Wilma schaut verwirrt auf die Zahlen. „Komisch! Ich bin mir sicher, dass ich mir das damals richtig überlegt habe!“';else if(s.type==='room'&&!solved('room'))state.error='Der Wunschzettel ist noch nicht gefunden. Schau dich weiter um!';else if(solved(s.type)){next();return}if(s.type==='room'&&state.error)state.roomLast=null;render();if(state.error){let p=$('.puzzle');if(p)p.scrollIntoView({block:'nearest',behavior:'smooth'})}}
$('#app').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let action=b.dataset.action,id=b.dataset.id;if(action==='next')checkNext();else if(action==='back')back();else if(action==='room'){if(!state.room.includes(id))state.room.push(id);state.roomLast=id;state.error='';save();render();$('#room-feedback').scrollIntoView({block:'nearest'})}else if(action==='map-point'){if(state.map.includes(id)){state.map=state.map.slice(0,state.map.indexOf(id))}else state.map.push(id);state.error='';save();render()}else if(action==='direction'){state.mapChoice=id;state.error='';save();render()}else if(action==='wallet'){state.wallet=id;state.error='';save();render()}else if(action==='hint'){let t=b.dataset.type;state.hints[t]=Math.min(2,(state.hints[t]||0)+1);save();render()}else if(action==='restart'){if(confirm('Möchtest du das Abenteuer wirklich von vorne beginnen?')){state=defaultState();save();render()}}});
$('#app').addEventListener('change',e=>{let el=e.target;if(el.dataset.action==='match'){state.matches[Number(el.dataset.index)]=el.value;state.error='';save();render()}});
$('#app').addEventListener('input',e=>{if(e.target.id==='code'){state.code=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=state.code;save()}});
$('#app').addEventListener('keydown',e=>{if(e.target.id==='code'&&e.key==='Enter'){e.preventDefault();checkNext()}});
$('#restart').addEventListener('click',()=>{if(confirm('Möchtest du das Abenteuer wirklich von vorne beginnen?')){state=defaultState();save();render()}});
render();
</script></body></html>
